if(i>=Q.length){const s=Q.filter((q,n)=>ans[n]!=null&&ok(q,ans[n])).length;
A.innerHTML=`<div class="r"><div class="meta"><span>RESULT</span></div><div class="big">${s} / ${Q.length}</div><p>${Math.round(s/Q.length*100)}%</p><button onclick="ans.length=0;i=0;show()">RESTART</button></div>`;return}
const q=Q[i],d=ans[i]!=null,c=Q.filter((x,n)=>ans[n]!=null&&ok(x,ans[n])).length;
A.innerHTML=`<div class="meta"><span>QUESTION ${i+1} / ${Q.length}</span><span>SCORE ${c}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><div class="q">${q[0]}</div>`+
q[1].map((t,k)=>`<button class="o ${d?(ok(q,k)?'ok':(ans[i]==k?'no':'')):''}" onclick="pick(${k})"><b>${L[k]}</b>${t}</button>`).join("")+
`<div class="n"><button onclick="i--;show()" ${i?'':'disabled'}>BACK</button><button onclick="i++;show()">${i==Q.length-1?'FINISH':'NEXT'}</button></div>`}
function pick(k){if(ans[i]!=null)return;ans[i]=k;show()}
show();
</script></body></html>
